# ════════════════════════════════════════════════════════════════════════════
#  سینک خودکار فورک با ریپوی اصلی
#
#  روی فورک: هر ۶ ساعت + با دکمهٔ «Run workflow» خودش را با ریپوی اصلی
#  (baddarksss/railway-3xui) همگام می‌کند. ریلوی هم با دیدن هر پوش، خودش
#  دیپلوی می‌کند — به‌شرطِ روشن بودن Auto Deploy در سرویس.
#
#  ⚠️ روی فورک باید یک‌بار فعال شود (گیت‌هاب ورک‌فلوهای زمان‌بندی‌شده را در
#     فورک‌ها به‌طور پیش‌فرض خاموش نگه می‌دارد):
#        Actions → Sync fork with upstream → Enable workflow
#  ⚠️ این ورک‌فلو فورک را «آینهٔ» ریپوی اصلی می‌کند؛ هر تغییر دستیِ خودت روی
#     فورک پاک می‌شود. اگر می‌خواهی خودت هم چیزی را عوض کنی، بگو تا روش امنش را
#     جور کنیم (شاخهٔ جدا / ریپوی جدا با آینه‌سازی دوطرفه).
# ════════════════════════════════════════════════════════════════════════════
name: Sync fork with upstream

on:
  schedule:
    - cron: "17 */6 * * *"   # هر ۶ ساعت — دقیقهٔ ۱۷ تا با شلوغی سرور گیت‌هاب قاطی نشود
  workflow_dispatch: {}      # اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  sync:
    # روی خودِ ریپوی اصلی کاری نمی‌کند؛ فقط روی فورک‌ها اجرا می‌شود
    if: github.repository != 'baddarksss/railway-3xui'
    runs-on: ubuntu-latest
    steps:
      - name: پیدا کردن ریپوی والد (upstream)
        id: up
        run: |
          if [ -n "${{ github.event.repository.parent.full_name }}" ]; then
            echo "source=${{ github.event.repository.parent.full_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "source=baddarksss/railway-3xui" >> "$GITHUB_OUTPUT"
          fi
      - name: همگام‌سازی
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔁 ${{ github.repository }} ← ${{ steps.up.outputs.source }}"
          gh repo sync "${{ github.repository }}" \
            --source "${{ steps.up.outputs.source }}" \
            --branch main \
            --force
          echo "✅ همگام شد — ریلوی اگر Auto Deploy روشن باشد، خودش دیپلوی می‌کند."
